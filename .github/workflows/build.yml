name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.18'
          python-version: '3.13'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libopenblas-dev patch
      - name: Sync locked Python dependencies
        run: uv sync --locked
      - name: Test WebSocket protocol with fake inference
        run: uv run --locked python -m unittest discover -s tests -p test_protocol.py -v
      - name: Build native runtime
        run: bash scripts/build-native.sh
      - name: Load native library without a model
        run: |
          uv run --locked python - <<'PY'
          import ctypes
          from pathlib import Path
          ctypes.CDLL(str(Path('build/native/libvime_qwen.so').resolve()))
          print('Native library loaded successfully')
          PY
      - name: Package Ubuntu 24.04 Linux x86_64 AVX2 runtime
        # Consumers need glibc >= 2.39, libopenblas0, and uv.
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vime-asr-linux-x86_64
          path: dist/vime-asr-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vime-asr-linux-x86_64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/vime-asr-linux-x86_64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes '预编译运行环境：Linux x86_64，AVX2/FMA，glibc >= 2.39（Ubuntu 24.04），系统 OpenBLAS（libopenblas0）及 uv。模型权重不包含在发布包中，需离线单独准备。'
